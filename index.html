<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>My Secure Vault</title>
    
    <!-- مكتبة التشفير فقط (مكتبة Supabase تم حذفها نهائياً لتخطي الحظر) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root { --bg-color: #121212; --surface-color: #1e1e1e; --primary-color: #00adb5; --primary-hover: #00939a; --text-main: #eeeeee; --text-muted: #999999; --danger: #ff4b4b; --border-radius: 8px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: var(--surface-color); padding: 30px; border-radius: var(--border-radius); width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        .mt-1 { margin-top: 10px; }
        h2 { margin-bottom: 20px; text-align: center; }
        .warning { color: var(--danger); font-size: 0.9em; margin-bottom: 15px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background-color: #2a2a2a; border: 1px solid #333; color: var(--text-main); border-radius: var(--border-radius); outline: none; transition: border 0.3s; }
        input:focus { border-color: var(--primary-color); }
        button { width: 100%; padding: 12px; background-color: var(--primary-color); color: #fff; border: none; border-radius: var(--border-radius); cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: var(--primary-hover); }
        button.outline { background-color: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); margin-top: 10px;}
        button.danger { background-color: var(--danger); color: white; }
        button.danger.outline { background-color: transparent; border-color: var(--danger); color: var(--danger); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .add-form { background-color: #2a2a2a; padding: 20px; border-radius: var(--border-radius); margin-bottom: 20px; }
        .grid { display: flex; flex-direction: column; gap: 15px; }
        .card { background-color: #2a2a2a; padding: 15px; border-radius: var(--border-radius); border-left: 4px solid var(--primary-color); }
        .card h3 { margin-bottom: 10px; }
        .card-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.9em; }
        .card-row span { color: var(--text-muted); }
        .card-actions { display: flex; gap: 10px; margin-top: 15px; }
        .card-actions button { padding: 6px; font-size: 0.85em; }
        @media (max-width: 600px) { .card-actions { flex-direction: column; } }
    </style>
</head>
<body>

    <div id="auth-section" class="container">
        <h2>تسجيل الدخول / التسجيل</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="signIn()">تسجيل الدخول</button>
        <button class="outline" onclick="signUp()">إنشاء حساب</button>
    </div>

    <div id="unlock-section" class="container hidden">
        <h2>فك تشفير الخزنة</h2>
        <p class="warning">أدخل كلمة مرور التشفير (Master Password).</p>
        <input type="password" id="master-password" placeholder="كلمة مرور التشفير">
        <button onclick="unlockVault()">فتح الخزنة</button>
        <button class="danger outline mt-1" onclick="signOut()">تسجيل الخروج</button>
    </div>

    <div id="app-section" class="container hidden">
        <header>
            <h2>خزنتي السرية</h2>
            <button class="danger" onclick="signOut()">تسجيل الخروج</button>
        </header>
        <div class="add-form">
            <input type="text" id="site-name" placeholder="اسم الموقع (مثال: Google)">
            <input type="text" id="site-username" placeholder="اسم المستخدم">
            <input type="password" id="site-password" placeholder="كلمة المرور">
            <button onclick="addEntry()">إضافة بيانات</button>
        </div>
        <input type="text" id="search-bar" placeholder="ابحث عن موقع..." onkeyup="filterCards()">
        <div id="vault-grid" class="grid"></div>
    </div>

    <script>
        // ضع المفاتيح الخاصة بك هنا
        
        const SUPABASE_URL = 'https://enmtfhfydqdpdwmtrdyq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oVGdtrR_S4VjIgeTkfFRgw_tLKNZWY2';

        let sessionToken = null;
        let currentUserId = null;
        let sessionMasterPassword = null;
        let inactivityTimer;

        const authSection = document.getElementById('auth-section');
        const unlockSection = document.getElementById('unlock-section');
        const appSection = document.getElementById('app-section');

        // تقنية الاتصال المباشر (Fetch) بدون مكتبات
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert('الرجاء إدخال البريد وكلمة المرور');

            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) alert('خطأ في التسجيل: ' + (data.msg || data.error_description || "تأكد من البيانات"));
                else alert('تم التسجيل بنجاح! يمكنك تسجيل الدخول الآن.');
            } catch(e) { alert('خطأ في الاتصال بالإنترنت!'); }
        }

        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert('الرجاء إدخال البريد وكلمة المرور');

            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    alert('خطأ في تسجيل الدخول: ' + (data.error_description || "بيانات غير صحيحة"));
                } else {
                    sessionToken = data.access_token;
                    currentUserId = data.user.id;
                    authSection.classList.add('hidden');
                    unlockSection.classList.remove('hidden');
                    startInactivityTimer();
                }
            } catch(e) { alert('خطأ في الاتصال بالإنترنت!'); }
        }

        function signOut() {
            sessionToken = null;
            currentUserId = null;
            sessionMasterPassword = null;
            authSection.classList.remove('hidden');
            unlockSection.classList.add('hidden');
            appSection.classList.add('hidden');
            clearTimeout(inactivityTimer);
        }

        function unlockVault() {
            const mp = document.getElementById('master-password').value;
            if (!mp) return alert('الرجاء إدخال كلمة مرور التشفير');
            sessionMasterPassword = mp;
            document.getElementById('master-password').value = '';
            unlockSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            fetchVaults();
        }

        function encrypt(text) { return CryptoJS.AES.encrypt(text, sessionMasterPassword).toString(); }

        function decrypt(ciphertext) {
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, sessionMasterPassword);
                return bytes.toString(CryptoJS.enc.Utf8) || '⚠️ خطأ في التشفير';
            } catch (e) { return '⚠️ خطأ في التشفير'; }
        }

        async function addEntry() {
            const site = document.getElementById('site-name').value;
            const user = document.getElementById('site-username').value;
            const pass = document.getElementById('site-password').value;
            if (!site || !user || !pass) return alert('الرجاء تعبئة جميع الحقول');
            
            const encUser = encrypt(user);
            const encPass = encrypt(pass);
            
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/vaults`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${sessionToken}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ user_id: currentUserId, site_name: site, encrypted_username: encUser, encrypted_password: encPass })
                });
                
                if (!res.ok) alert('خطأ أثناء الحفظ');
                else {
                    document.getElementById('site-name').value = '';
                    document.getElementById('site-username').value = '';
                    document.getElementById('site-password').value = '';
                    fetchVaults();
                }
            } catch(e) { alert('خطأ في الاتصال بالإنترنت!'); }
        }

        async function fetchVaults() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/vaults?order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${sessionToken}` }
                });
                const data = await res.json();
                if (!res.ok) console.error(data);
                else renderCards(data);
            } catch(e) { console.error('فشل جلب البيانات'); }
        }

        function renderCards(vaults) {
            const grid = document.getElementById('vault-grid');
            grid.innerHTML = '';
            vaults.forEach(item => {
                const plainUser = decrypt(item.encrypted_username);
                const plainPass = decrypt(item.encrypted_password);
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-site', item.site_name.toLowerCase());
                card.innerHTML = `
                    <h3>${item.site_name}</h3>
                    <div class="card-row"><span>المستخدم:</span><strong id="user-${item.id}">••••••••</strong></div>
                    <div class="card-row"><span>المرور:</span><strong id="pass-${item.id}">••••••••</strong></div>
                    <div class="card-actions">
                        <button class="outline" onclick="toggleVisibility('${item.id}', '${plainUser}', '${plainPass}')">إظهار/إخفاء</button>
                        <button onclick="copyToClipboard('${plainUser}')">نسخ المستخدم</button>
                        <button onclick="copyToClipboard('${plainPass}')">نسخ المرور</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleVisibility(id, user, pass) {
            const userEl = document.getElementById(`user-${id}`);
            const passEl = document.getElementById(`pass-${id}`);
            if (userEl.innerText === '••••••••') { userEl.innerText = user; passEl.innerText = pass; }
            else { userEl.innerText = '••••••••'; passEl.innerText = '••••••••'; }
        }

        function copyToClipboard(text) {
            if(text.includes('⚠️')) return alert('بيانات مشفرة خطأ');
            navigator.clipboard.writeText(text).then(() => alert('تم النسخ!'));
        }

        function filterCards() {
            const term = document.getElementById('search-bar').value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = card.getAttribute('data-site').includes(term) ? 'block' : 'none';
            });
        }

        function resetTimer() { if (sessionToken) { clearTimeout(inactivityTimer); startInactivityTimer(); } }
        function startInactivityTimer() { inactivityTimer = setTimeout(() => { alert('تم إغلاق الجلسة لخمول الموقع'); signOut(); }, 300000); }

        window.onload = resetTimer;
        document.onmousemove = resetTimer;
        document.onkeypress = resetTimer;
        document.ontouchstart = resetTimer;
    </script>
</body>
</html>
